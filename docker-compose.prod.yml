name: convelina-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: convelina-postgres-prod
    restart: always
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-consolith}
    # No exposed host ports in production; accessible only via internal network
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-consolith}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: convelina-qdrant-prod
    restart: always
    # No exposed host ports in production; accessible only via internal network
    expose:
      - "6333"
    volumes:
      - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: convelina-prod-backend:latest
    container_name: convelina-backend-prod
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    expose:
      - "8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - TEST_MODE_ALLOW_SIMULATED_TOKENS=False
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/serviceAccountKey.json}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal-net
      - public-net
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: convelina-prod-frontend:latest
    container_name: convelina-frontend-prod
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - public-net
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: convelina-prod-backend:latest
    container_name: convelina-migrate-prod
    command: ["python", "-m", "app.core.migrate"]
    environment:
      - DATABASE_MIGRATION_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-consolith}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    networks:
      - internal-net
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.8-alpine
    container_name: convelina-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - public-net
    security_opt:
      - no-new-privileges:true

networks:
  internal-net:
    internal: true
  public-net:

volumes:
  postgres_prod_data:
  qdrant_prod_data:
  caddy_prod_data:
  caddy_prod_config:

